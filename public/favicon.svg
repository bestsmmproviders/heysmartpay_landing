<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#d9dde2"/>
      <stop offset="0.52" stop-color="#8e949b"/>
      <stop offset="0.66" stop-color="#e6e9ec"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.82" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#000"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>
  <!-- H monogram, geometric, wide stance -->
  <g fill="url(#metal)">
    <rect x="16" y="15" width="7" height="30"/>
    <rect x="41" y="15" width="7" height="30"/>
    <rect x="16" y="27" width="32" height="6"/>
  </g>
  <!-- horizon -->
  <rect x="10" y="50" width="44" height="1" fill="url(#line)"/>
</svg>
